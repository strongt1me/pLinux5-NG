name: Build offsets tool

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "source/tools/offsets/**"
      - "include/tools/offsets/**"
      - "Makefile"
      - ".github/workflows/build-tools.yml"
  pull_request:
    branches: [master]
    paths:
      - "source/tools/offsets/**"
      - "include/tools/offsets/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y \
            clang-21 \
            lld-21 \
            llvm-21 \
            gcc \
            make \
            binutils \
            wget \
            unzip \
            ca-certificates

          # The pLabs5 llvm-config shim (--bindir) resolves the unversioned
          # llvm tools it wants to symlink (ld.lld, llvm-ar, ...) from PATH.
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Download PS5 Payload SDK
        run: |
          wget -q \
            -O ps5-payload-sdk.zip \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip

          echo "4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0  ps5-payload-sdk.zip" \
            | sha256sum --check -

          sudo unzip -q -d /opt ps5-payload-sdk.zip

          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Checkout pLabs5 SDK
        uses: actions/checkout@v5
        with:
          repository: pLabs5/pLabs5-SDK
          path: pLabs5-SDK

      - name: Build offsets-tool
        run: |
          make clean
          make offsets-tool -j"$(nproc)"
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
          LLVM_CONFIG: ${{ github.workspace }}/pLabs5-SDK/tools/nixos/llvm-config

      - name: Generate checksum
        run: |
          sha256sum bin/offsets-tool.elf > bin/offsets-tool.elf.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: offsets-tool
          path: |
            bin/offsets-tool.elf
            bin/offsets-tool.elf.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    # Tag-gated, like the main workflow: only publish on a v* tag push. The
    # tag push also runs build-pLinux5-NG.yml's release job; both attach to the
    # same GitHub Release (softprops get-or-create), so the offsets binary
    # lands alongside pLinux5-NG.elf on that release.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: offsets-tool
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/offsets-tool.elf
            release/offsets-tool.elf.sha256
