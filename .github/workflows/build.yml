name: Build pLinux5-NG

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 gcc python3 wget unzip

      - name: Download PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -d /opt ps5-payload-sdk.zip

      - name: Build
        run: make -j$(nproc)
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pLinux5-NG
          path: bin/pLinux5-NG.elf
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pLinux5-NG

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: pLinux5-NG.elf
          generate_release_notes: true
